name: Tests

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  tests:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: [8.3, 8.4]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: helpsub_test
          POSTGRES_USER: helpsub_user
          POSTGRES_PASSWORD: helpsub_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pgsql, redis, gd, zip, bcmath
          coverage: xdebug
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v3
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan config:clear

      - name: Run database migrations
        env:
          DB_CONNECTION: pgsql_testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: helpsub_test
          DB_USERNAME: helpsub_user
          DB_PASSWORD: helpsub_password
        run: php artisan migrate --force

      - name: Run tests
        env:
          DB_CONNECTION: pgsql_testing
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: helpsub_test
          DB_USERNAME: helpsub_user
          DB_PASSWORD: helpsub_password
          REDIS_HOST: localhost
          REDIS_PORT: 6379
        run: php artisan test --coverage --min=70

      - name: Upload coverage reports
        if: matrix.php == '8.4'
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
